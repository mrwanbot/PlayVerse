<body>

<div class="background"></div>

<div class="container">

    <img src="assets/logo.png" class="logo" alt="PlayVerse Logo">

    <h1>Play Verse</h1>

    <p>Create. Host. Play.</p>

    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="off">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <a href="forgot-password.html" class="forgot">
        Forgot Password?
    </a>

    <button id="loginButton">
        Login
    </button>

    <div class="divider">
        <span>OR</span>
    </div>

    <button class="google-btn">
        Continue with Google
    </button>

    <p class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </p>

</div>

<script src="js/login.js"></script>

</body>
