<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse | Dashboard</title>

<link rel="icon" href="assets/favicon.png">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="background"></div>

<div class="container">

<img src="assets/logo.png" class="logo">

<h1>PLAYVERSE</h1>

<p id="welcomePlayer"></p>

<div class="card">

<img
id="avatar"
class="avatar"
src="https://mc-heads.net/avatar/Steve/150"
alt="Avatar">

<img
id="skin"
class="skin"
src="https://starlightskins.lunareclipse.studio/render/default"
alt="Skin">

<h3 id="playerName">Player</h3>

<div class="info">
<span class="label">Server</span>
<span class="value" id="serverName">BlockHub</span>
</div>

<div class="info">
<span class="label">Status</span>
<span class="online">🟢 Online</span>
</div>

<div class="info">
<span class="label">Edition</span>
<span class="value">Java + Bedrock</span>
</div>

<div class="info">
<span class="label">Version</span>
<span class="value">1.21.11</span>
</div>

<div class="info">
<span class="label">Players</span>
<span class="value">0 / 20</span>
</div>

<div class="info">
<span class="label">Ping</span>
<span class="value">-- ms</span>
</div>

<div class="info">
<span class="label">IP</span>
<span class="value" id="serverIP">
play.blockhub.net
</span>
</div>

<button class="copy" id="copyIP">

📋 Copy Server IP

</button>

<button class="join" id="joinMinecraft">

🎮 Join Minecraft

</button>

<div
id="message"
class="success"
style="display:none;">

IP Copied Successfully!

</div>

</div>

</div>

<script src="js/dashboard.js"></script>

</body>

  </html>
